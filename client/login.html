
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Client Login | WealthTheShaper</title>

  <style>
    :root {
      --red: #e32636;
      --bg: #080808;
      --panel: #141414;
      --text: #fff;
      --muted: #b6b6bd;
      --border: rgba(255,255,255,.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 10%, rgba(227,38,54,.15), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    .logo-wrap {
      width: 106px;
      height: 106px;
      margin: 0 auto 20px;
      padding: 5px;
      border-radius: 50%;
      border: 1px solid rgba(227,38,54,.65);
      background: rgba(255,255,255,.04);
      box-shadow: 0 0 35px rgba(227,38,54,.18);
      animation: floatLogo 3s ease-in-out infinite;
    }

    .logo-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    .brand {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .brand span { color: var(--red); }

    h1 {
      font-size: clamp(27px, 6vw, 35px);
      margin: 0 0 10px;
    }

    .intro {
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
      margin: 0 auto 26px;
      max-width: 360px;
    }

    .card {
      text-align: left;
      padding: clamp(22px, 5vw, 30px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(28,28,28,.96), rgba(12,12,12,.98));
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      padding: 5px;
      border-radius: 11px;
      background: #090909;
      margin-bottom: 24px;
    }

    .tab {
      padding: 12px 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: var(--red);
      color: white;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #e3e3e7;
    }

    .field { margin-bottom: 18px; }

    input {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 12px 13px;
      color: white;
      background: #090909;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(227,38,54,.12);
    }

    .password-row {
      display: flex;
      gap: 8px;
    }

    .password-row input { flex: 1; min-width: 0; }

    .show-password {
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: white;
      background: #222;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: var(--red);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, opacity .2s;
    }

    .primary:hover { transform: translateY(-1px); }
    .primary:disabled { opacity: .6; cursor: wait; }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin: -5px 0 18px;
    }

    a { color: #ff7b86; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .notice {
      display: none;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .foot {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      margin-top: 23px;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #ddd;
      font-size: 13px;
    }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      .logo-wrap { animation: none; }
      .primary { transition: none; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="logo-wrap">
      <img src="../image/wealth.png"
           alt="WealthTheShaper logo"
           onerror="this.style.display='none';">
    </div>

    <div class="brand">WEALTH<span>THESHAPER</span></div>
    <h1 id="pageTitle">Welcome Back</h1>
    <p class="intro" id="pageIntro">
      Sign in to manage your bookings and keep track of your business growth journey.
    </p>

    <section class="card">
      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">Log In</button>
        <button class="tab" id="signupTab" type="button">Create Account</button>
      </div>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>

      <form id="authForm">
        <div class="field" id="nameField" hidden>
          <label for="fullName">Full name</label>
          <input id="fullName" type="text" maxlength="120"
                 autocomplete="name" placeholder="Your full name">
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" maxlength="254"
                 autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-row">
            <input id="password" type="password" minlength="8"
                   autocomplete="current-password"
                   placeholder="At least 8 characters" required>
            <button class="show-password" id="togglePassword"
                    type="button">Show</button>
          </div>
        </div>

        <div class="field" id="confirmField" hidden>
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" type="password" minlength="8"
                 autocomplete="new-password"
                 placeholder="Enter your password again">
        </div>

        <div class="forgot-row" id="forgotRow">
          <a href="#" id="forgotPassword">Forgot password?</a>
        </div>

        <button class="primary" id="submitButton" type="submit">
          Log In
        </button>
      </form>
    </section>

    <p class="foot">
      Your account gives you access to your own client information and bookings.
      Keep your password private.
    </p>

    <a class="back-link" href="../index.html">← Back to WealthTheShaper</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    "use strict";

    const SUPABASE_URL =
      "https://leneltfdgtjkyziqulol.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_vEZoz6jKtXzMhlxVH27O9A_kuibGnl2";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = id => document.getElementById(id);

    let mode = "login";
    
const loginParams = new URLSearchParams(window.location.search);

const requestedService = loginParams.get("service");
const requestedNext = loginParams.get("next");

function getPostLoginDestination() {
  if (requestedNext === "booking" && requestedService) {
    return "dashboard.html?next=booking&service=" +
      encodeURIComponent(requestedService);
  }

  return "dashboard.html";
}


    function showNotice(message, isError = false) {
      const notice = $("notice");
      notice.textContent = message;
      notice.style.display = "block";
      notice.style.color = isError ? "#ff9aa3" : "#a5efbd";
      notice.style.borderColor = isError
        ? "rgba(227,38,54,.55)"
        : "rgba(80,200,120,.4)";
    }

    function clearNotice() {
      $("notice").style.display = "none";
      $("notice").textContent = "";
    }

    function setMode(nextMode) {
      mode = nextMode;
      clearNotice();

      const signup = mode === "signup";

      $("loginTab").classList.toggle("active", !signup);
      $("signupTab").classList.toggle("active", signup);

      $("nameField").hidden = !signup;
      $("confirmField").hidden = !signup;
      $("forgotRow").hidden = signup;

      $("fullName").required = signup;
      $("confirmPassword").required = signup;
      $("password").autocomplete =
        signup ? "new-password" : "current-password";

      $("pageTitle").textContent =
        signup ? "Create Your Account" : "Welcome Back";

      $("pageIntro").textContent = signup
        ? "Create your client account to manage bookings and access your client dashboard."
        : "Sign in to manage your bookings and keep track of your business growth journey.";

      $("submitButton").textContent =
        signup ? "Create Account" : "Log In";
    }

    $("loginTab").addEventListener("click", () => setMode("login"));
    $("signupTab").addEventListener("click", () => setMode("signup"));

    $("togglePassword").addEventListener("click", () => {
      const input = $("password");
      const visible = input.type === "password";
      input.type = visible ? "text" : "password";
      $("togglePassword").textContent = visible ? "Hide" : "Show";
    });

    $("authForm").addEventListener("submit", async event => {
      event.preventDefault();
      clearNotice();

      const email = $("email").value.trim();
      const password = $("password").value;
      const button = $("submitButton");

      if (password.length < 8) {
        showNotice("Your password must contain at least 8 characters.", true);
        return;
      }

      if (mode === "signup") {
        const fullName = $("fullName").value.trim();
        const confirmPassword = $("confirmPassword").value;

        if (!fullName) {
          showNotice("Please enter your full name.", true);
          return;
        }

        if (password !== confirmPassword) {
          showNotice("The passwords do not match.", true);
          return;
        }
      }

      button.disabled = true;
      button.textContent =
        mode === "signup" ? "Creating account..." : "Signing in...";

      try {
        if (mode === "signup") {
          const fullName = $("fullName").value.trim();

          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              data: {
                full_name: fullName
              },
              emailRedirectTo:
  "https://fofanaumar73-ai.github.io/wealththeshaper/client/dashboard.html"
            }
          });

          if (error) throw error;

          if (data.session) {
            window.location.replace("dashboard.html");
            return;
          }

          showNotice(
            "Your account has been created. Check your email for a confirmation link, then log in."
          );
          setMode("login");

        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          window.location.replace("dashboard.html");
          return;
        }

      } catch (error) {
        console.error("Client authentication failed:", error);
        showNotice(error.message || "Authentication failed. Please try again.", true);
      } finally {
        button.disabled = false;
        button.textContent =
          mode === "signup" ? "Create Account" : "Log In";
      }
    });

    $("forgotPassword").addEventListener("click", async event => {
      event.preventDefault();
      clearNotice();

      const email = $("email").value.trim();

      if (!email) {
        showNotice("Enter your email address first, then choose Forgot password.", true);
        $("email").focus();
        return;
      }

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo:
  "https://fofanaumar73-ai.github.io/wealththeshaper/client/reset-password.html"
        });

        if (error) throw error;

        showNotice(
          "If an account exists for that address, a password-reset email will be sent. The reset page must be configured to complete the process."
        );
      } catch (error) {
        console.error("Password reset request failed:", error);
        showNotice(error.message || "Could not request a password reset.", true);
      }
    });

    async function checkExistingSession() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        console.error("Could not check session:", error);
        return;
      }

      if (data.session) {
        window.location.replace("dashboard.html");
      }
    }

    checkExistingSession();
  })();
  </script>
</body>
</html>
